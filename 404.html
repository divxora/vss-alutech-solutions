  <div id="root"></div>

  <!-- Vite local development entry point -->

  <!-- GitHub Pages automatic self-healing fallback:
       If GitHub Pages is serving unbundled source from main branch root instead of the build artifact,
       this script detects that React has not mounted and dynamically loads the compiled production bundle
       from the repository's gh-pages branch so the website renders immediately with zero white screen. -->
  <script>
    (function() {
      if (!window.location.hostname.endsWith('github.io')) return;

      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            console.warn('[VSS Alutech] GitHub Pages is serving unbundled root from main branch. Bootstrapping compiled bundle from gh-pages branch...');
            fetch('https://cdn.jsdelivr.net/gh/divxora/vss-alutech-solutions@gh-pages/index.html?t=' + Date.now())
              .then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
              })
              .then(function(html) {
                var parser = new DOMParser();
                var doc = parser.parseFromString(html, 'text/html');

                // Inject compiled CSS
                var links = doc.querySelectorAll('link[rel="stylesheet"]');
                links.forEach(function(l) {
                  var href = l.getAttribute('href');
                  if (href && href.indexOf('assets/') !== -1) {
                    var link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = 'https://cdn.jsdelivr.net/gh/divxora/vss-alutech-solutions@gh-pages/' + href.replace('/vss-alutech-solutions/', '');
                    document.head.appendChild(link);
                  }
                });

                // Inject compiled JS
                var scripts = doc.querySelectorAll('script[type="module"]');
                scripts.forEach(function(s) {
                  var src = s.getAttribute('src');
                  if (src && src.indexOf('assets/') !== -1) {
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.crossOrigin = 'anonymous';
                    script.src = 'https://cdn.jsdelivr.net/gh/divxora/vss-alutech-solutions@gh-pages/' + src.replace('/vss-alutech-solutions/', '');
                    document.body.appendChild(script);
                  }
                });
              })
              .catch(function(err) {
                console.error('[VSS Alutech] Fallback loader error:', err);
                if (root && root.children.length === 0) {
                  root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A192F;color:white;font-family:sans-serif;padding:24px;text-align:center;">' +
                    '<div style="max-width:560px;background:#112240;padding:32px;border-radius:12px;border:1px solid #FF6B00;box-shadow:0 10px 30px rgba(0,0,0,0.5);">' +
                    '<div style="font-size:36px;margin-bottom:12px;">⚙️</div>' +
                    '<h2 style="color:#FF6B00;margin:0 0 12px;font-size:22px;font-weight:700;">GitHub Pages Deployment Source Notice</h2>' +
                    '<p style="color:#8892B0;line-height:1.6;font-size:14px;margin-bottom:20px;">GitHub Pages is currently serving the raw unbuilt repository root (<code>main</code> branch) instead of the built artifact.</p>' +
                    '<div style="background:#020C1B;padding:16px;border-radius:8px;text-align:left;font-size:13px;color:#CCD6F6;line-height:1.8;">' +
                    '<strong style="color:#FF6B00;">Quick 10-Second Fix in GitHub:</strong><br>' +
                    '1. Open <b>Settings &rarr; Pages</b> in this repository<br>' +
                    '2. Under <i>Build and deployment &rarr; Branch</i>: change <b>main</b> to <b>gh-pages</b><br>' +
                    '3. Click <b>Save</b> and refresh.' +
                    '</div>' +
                    '</div></div>';
                }
              });
          }
        }, 1200);
      });
    })();
  </script>
