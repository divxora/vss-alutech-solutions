services:
  - type: web
    name: vss-alutech-backend
    env: node
    plan: free
    region: singapore # Closest to India for minimum latency
    buildCommand: npm install && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SQLITE_DB_PATH
        value: /app/data/vss_alutech.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: ADMIN_DEFAULT_EMAIL
        value: vssalutechsolutions@gmail.com
      - key: ADMIN_NOTIFICATION_EMAIL
        value: vssalutechsolutions@gmail.com
      # Optional cloud mirror (Supabase PostgreSQL) for multi-year retention across container rebuilds:
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_SERVICE_ROLE_KEY
      #   sync: false
      # Set your SMTP credentials in the Render dashboard for real email delivery:
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: 587
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: SMTP_FROM
      #   value: "VSS Alutech Solutions" <vssalutechsolutions@gmail.com>
    disk:
      name: vss-data
      mountPath: /app/data
      sizeGB: 1
